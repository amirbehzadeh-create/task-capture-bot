name = "task-capture-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

# One combined cron (not three separate entries) firing at :30 past 4, 5 and 6
# UTC — matching 8:00 / 9:00 / 10:00 AM Tehran (Iran no longer observes DST, so
# the UTC+3:30 offset is constant year-round). Cloudflare's free plan caps an
# account at 5 cron triggers total across every Worker on it, so this Worker
# uses a single trigger entry instead of one per hour.
[triggers]
crons = ["30 4,5,6 * * *"]
